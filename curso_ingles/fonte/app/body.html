<div class="app" id="app">
  <header class="topbar" id="topbar">
    <div class="brand" aria-label="Fluent">fluent<span class="brand-dot"></span><span class="brand-lang" id="brandLang" hidden></span></div>
    <div class="top-chips">
      <button class="chip-btn streak-chip" id="topStreak" data-go="profile" aria-label="Sequência de dias"><svg class="ic"><use href="#i-flame"/></svg><b>0</b></button>
      <button class="chip-btn coin-chip" id="topCoins" data-go="quests" aria-label="Moedas"><svg class="ic"><use href="#i-coin"/></svg><b>0</b></button>
      <button class="chip-btn goal-chip" id="topGoal" data-go="profile" aria-label="Meta diária"><span class="mini-ring" style="--p:0"></span><b>0</b></button>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Navegação principal">
    <div class="rail-brand">fluent<span class="brand-dot"></span><span class="brand-lang" id="railLang" hidden></span></div>
    <button class="tab active" data-tab="home"><svg class="ic"><use href="#i-path"/></svg><span>Trilha</span></button>
    <button class="tab" data-tab="review"><svg class="ic"><use href="#i-review"/></svg><span>Revisar</span><em class="tab-badge" id="tabDue" hidden></em></button>
    <button class="tab" data-tab="practice"><svg class="ic"><use href="#i-dumbbell"/></svg><span>Praticar</span></button>
    <button class="tab" data-tab="quests"><svg class="ic"><use href="#i-flag"/></svg><span>Missões</span><em class="tab-badge gold" id="tabQuest" hidden></em></button>
    <button class="tab" data-tab="profile"><svg class="ic"><use href="#i-user"/></svg><span>Perfil</span></button>
  </nav>

  <main class="view" id="view" tabindex="-1"></main>

  <aside class="side" id="side" aria-label="Seu dia"></aside>
</div>

<section class="lesson" id="lesson" hidden aria-modal="true" role="dialog" aria-label="Lição">
  <div class="l-head">
    <button class="icon-btn" id="lessonClose" aria-label="Sair da lição"><svg class="ic"><use href="#i-close"/></svg></button>
    <div class="l-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="lessonBar"><span></span></div>
    <div class="combo" id="combo" hidden><svg class="ic"><use href="#i-bolt"/></svg><b>0</b></div>
  </div>
  <div class="l-body" id="lessonBody"><div class="l-inner" id="lessonInner" tabindex="-1"></div></div>
  <div class="l-foot" id="lessonFoot"></div>
  <div class="sheet" id="sheet" hidden></div>
</section>

<section class="lesson stage" id="stage" hidden aria-modal="true" role="dialog" aria-label="Atividade">
  <div class="l-head">
    <button class="icon-btn" id="stageClose" aria-label="Fechar"><svg class="ic"><use href="#i-close"/></svg></button>
    <div class="stage-title" id="stageTitle"></div>
    <div class="stage-extra" id="stageExtra"></div>
  </div>
  <div class="l-body" id="stageBody"><div class="l-inner" id="stageInner" tabindex="-1"></div></div>
  <div class="l-foot" id="stageFoot"></div>
</section>

<div class="modal-wrap" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" id="modalBox"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
